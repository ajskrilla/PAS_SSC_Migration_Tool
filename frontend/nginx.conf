# HTTP listener: redirect everything to HTTPS.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS listener: serves the SPA and reverse-proxies the API.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /tmp/certs/server.crt;
    ssl_certificate_key /tmp/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime DNS resolution so we don't crash if api isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_api http://api:8080;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # SSE streaming endpoint — must disable buffering or nginx holds
    # the entire response until the connection closes (defeats streaming).
    location /api/engagements/ {
        set $upstream_api http://api:8080;
        proxy_pass         $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
        # Disable buffering for SSE
        proxy_buffering        off;
        proxy_cache            off;
        proxy_set_header       X-Accel-Buffering no;
        # Keep the chunked transfer encoding intact
        chunked_transfer_encoding on;
    }

    location /health/ {
        set $upstream_health http://api:8080;
        proxy_pass         $upstream_health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
