name: pas-migration

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pasmig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: pasmig
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasmig -d pasmig"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local AI, CPU-only. Runs entirely in-container so customer tenant data
  # (folder/account names) never leaves the boundary. Fits comfortably in 16GB.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # No GPU reservation - CPU inference. A quantized 7-8B model is the target.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pulls the chat + embedding models on first run, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling chat model: $$CHAT_MODEL";
        ollama pull "$$CHAT_MODEL";
        echo "Pulling embedding model: $$EMBED_MODEL";
        ollama pull "$$EMBED_MODEL";
        echo "Model pull complete.";
    restart: "no"

  api:
    build:
      context: ./src
      dockerfile: Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=pasmig;Username=pasmig;Password=${POSTGRES_PASSWORD:-changeme_dev_only}"
      Ai__Provider: ${AI_PROVIDER:-ollama}
      # In-container Ollama is reached by service name, not host.docker.internal.
      Ai__Ollama__Endpoint: ${OLLAMA_ENDPOINT:-http://ollama:11434}
      Ai__Ollama__ChatModel: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      Ai__Ollama__EmbedModel: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "443:8443"   # HTTPS (self-signed cert generated at startup)
      - "80:8080"    # HTTP -> redirects to HTTPS
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
