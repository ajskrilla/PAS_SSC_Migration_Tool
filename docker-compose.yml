name: pas-migration

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pasmig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: pasmig
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    # No host port: only the api container needs Postgres. For ad-hoc host access use
    # `docker compose exec db psql -U pasmig -d pasmig`, or temporarily add
    # `ports: ["127.0.0.1:5432:5432"]` for debugging.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasmig -d pasmig"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local AI, CPU-only. Runs entirely in-container so customer tenant data
  # (folder/account names) never leaves the boundary. Fits comfortably in 16GB.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # No host port: only the api container talks to Ollama (http://ollama:11434 on the
    # compose network). Publishing it let anyone on the LAN query or delete the models.
    # A side benefit: a native Ollama on the host no longer conflicts with this container.
    # No GPU reservation - CPU inference. A quantized 7-8B model is the target.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pulls the chat + embedding + safety-guard models on first run, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      GUARD_MODEL: ${OLLAMA_GUARD_MODEL:-llama-guard3:1b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling chat model: $$CHAT_MODEL";
        ollama pull "$$CHAT_MODEL";
        echo "Pulling embedding model: $$EMBED_MODEL";
        ollama pull "$$EMBED_MODEL";
        echo "Pulling safety guard model: $$GUARD_MODEL";
        ollama pull "$$GUARD_MODEL";
        echo "Model pull complete.";
    restart: "no"

  api:
    build:
      context: ./src
      dockerfile: Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=pasmig;Username=pasmig;Password=${POSTGRES_PASSWORD:-changeme_dev_only}"
      # Master app secret. Signs JWTs AND derives the AES-256-GCM credential-encryption key.
      # `:?` makes compose refuse to start (with this message) if it isn't set in .env —
      # there is deliberately no default: a known fallback would make tokens forgeable and
      # stored tenant credentials decryptable by anyone with the source code.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set in .env (generate with `openssl rand -base64 48`)}
      Ai__Provider: ${AI_PROVIDER:-ollama}
      # In-container Ollama is reached by service name, not host.docker.internal.
      Ai__Ollama__Endpoint: ${OLLAMA_ENDPOINT:-http://ollama:11434}
      Ai__Ollama__ChatModel: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      Ai__Ollama__EmbedModel: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      Ai__Ollama__GuardModel: ${OLLAMA_GUARD_MODEL:-llama-guard3:1b}
    # No host port: the API is reached only through the nginx reverse proxy (TLS + same-origin
    # cookies). Publishing 8080 exposed the API on the LAN, bypassing TLS entirely.
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "443:8443"   # HTTPS (self-signed cert generated at startup)
      - "80:8080"    # HTTP -> redirects to HTTPS
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
